version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: lore
    binary: lore
    main: ./cmd/lore
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/meredian-labs/lore/internal/cli.Version={{.Version}}
      - -X github.com/meredian-labs/lore/internal/cli.Commit={{.ShortCommit}}
      - -X github.com/meredian-labs/lore/internal/cli.BuildDate={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "Merge pull request"

# Homebrew formula is maintained by `make tap` (see Makefile)
