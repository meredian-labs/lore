version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: lore
    binary: lore
    main: ./cmd/lore
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/nishchay/lore/internal/cli.Version={{.Version}}
      - -X github.com/nishchay/lore/internal/cli.Commit={{.ShortCommit}}
      - -X github.com/nishchay/lore/internal/cli.BuildDate={{.Date}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "Merge pull request"

brews:
  - name: lore
    homepage: https://github.com/meredian-labs/lore
    description: "Local-first engineering memory system"
    repository:
      owner: meredian-labs
      name: homebrew-tap
    install: |
      bin.install "lore"
      (bin/"glh").write_to bin.join("lore")
      bin.install_symlink "lore" => "glh"
    test: |
      system "#{bin}/lore", "--version"
      system "#{bin}/glh", "--version"
