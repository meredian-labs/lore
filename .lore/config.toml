# Lore repository configuration
# Generated by lore init — edit to customize

[llm]
provider = "ollama"
model    = "llama3"
endpoint = "http://localhost:11434"

[extraction]
min_tasks           = 1
task_retention_days = 30

[node_resolution]
min_confidence        = 0.4
tag_overlap_threshold = 0.5

[output]
color = true
