title: Lore
description: Git stores what changed. Lore stores why it changed.
baseurl: "/lore"
url: "https://meredian-labs.github.io"

remote_theme: just-the-docs/just-the-docs@v0.10.0

color_scheme: dark

aux_links:
  "GitHub":
    - "//github.com/meredian-labs/lore"
aux_links_new_tab: true

back_to_top: true
back_to_top_text: "Back to top"

heading_anchors: true

search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10

footer_content: "Copyright &copy; 2026 Meredian Labs. Local-first engineering memory."

callouts_level: quiet
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red

exclude:
  - ARCHITECTURE.md
  - ROADMAP.md
  - SCHEMA.md
  - rules/

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
